# Factory firmware of the kind the P28 (304) carries, and tunes made on it that keep its map
# layout. Checked on ROM numbers 243, 244, 245, 248, 249, 251, 259, 301, 303, 304, 305, 311,
# 314, 315, 317, 318, 321 and 327. The P28 with ROM number 230 is of the P30 type.
id = "obd1-p28"
name = "Honda OBD1, P28 type"
platform = "obd1-66207"
rom_size = 0x8000

# The fingerprint is the code that finds the four main maps and their axes, and that turns
# engine speed and manifold pressure into the codes the axes are written in. A ROM that holds
# these bytes reads its maps from the addresses below, in the units given below; one whose maps
# were moved or resized, or whose MAP sensor scaling was changed, does not match.
[[fingerprint]]
bytes = [
    # Log-rpm code: 64 steps per octave from 500 rpm.
    { address = 0x07D3, value = [0x47, 0x98, 0xC0, 0xFF, 0x44, 0x98, 0x07, 0x00, 0x46, 0x98, 0x53, 0x07, 0x60, 0x00, 0x53] },
    # Linear rpm code: 53248 / period.
    { address = 0x0830, value = [0x44, 0x98, 0x00, 0xD0, 0xF9, 0x90, 0x37] },
    # MAP code.
    { address = 0x0861, value = [0x32, 0xF8, 0x58] },
    # Low-cam rpm breakpoints.
    { address = 0x0A0C, value = [0x60, 0x14, 0x70, 0xC3, 0x46, 0x4B, 0xC4, 0x38, 0x4A, 0x9E, 0x12] },
    # High-cam rpm breakpoints.
    { address = 0x0A24, value = [0x60, 0x28, 0x70, 0xC3, 0x47, 0x4B, 0xC5, 0xC2, 0x4A, 0x9E, 0x12] },
    # Ignition MAP breakpoints.
    { address = 0x0A50, value = [0x60, 0x00, 0x70, 0xC3, 0x3B, 0x4B, 0x9E, 0x08] },
    # Fuel MAP breakpoints.
    { address = 0x0A65, value = [0x60, 0x00, 0x70, 0xC3, 0x3C, 0x4B, 0x9E, 0x08] },
    # Ignition: 10 columns, 20 rows.
    { address = 0x0B67, value = [0x98, 0x0A, 0x99, 0x14, 0xC3, 0x3B, 0x4A, 0xB3, 0x3E, 0x79] },
    # Ignition: low-cam map.
    { address = 0x0B74, value = [0xC3, 0x46, 0x4B, 0xB3, 0x42, 0x4B, 0x60, 0xE4, 0x72] },
    # Ignition: high-cam map.
    { address = 0x0B8B, value = [0xC3, 0x47, 0x4B, 0xB3, 0x44, 0x4B, 0x60, 0xAC, 0x73] },
    # Ignition: lookup without column multipliers.
    { address = 0x0BAF, value = [0xA3, 0x0D, 0x32, 0xE4, 0x59] },
    # Fuel: 10 columns, 20 rows, high-cam map.
    { address = 0x12FC, value = [0x98, 0x0A, 0x99, 0x14, 0xC4, 0xBC, 0x4A, 0xB4, 0xC0, 0x79, 0xC4, 0xC7, 0x4B, 0xB4, 0xC4, 0x4B, 0x60, 0x22, 0x71] },
    # Fuel: low-cam map.
    { address = 0x131D, value = [0xC4, 0xC6, 0x4B, 0xB4, 0xC2, 0x4B, 0x60, 0x50, 0x70] },
    # Fuel: lookup with column multipliers.
    { address = 0x133E, value = [0xA3, 0x1D, 0x32, 0xE4, 0x59] },
    # MAP code = 2 x (sample - 24).
    { address = 0x58F8, value = [0xA6, 0x18, 0xCA, 0x09, 0xC5, 0x07, 0x2F, 0x33, 0xCD, 0x02, 0x77, 0xFF, 0x01, 0xFA, 0x01] },
    # Breakpoint search.
    { address = 0x59B2, value = [0xF9, 0x88, 0x8A, 0x7B, 0x4E, 0xCA, 0x01, 0x7E, 0x8E, 0x90, 0x81, 0xAE, 0x70, 0x90, 0xAA, 0xC9, 0x03, 0x4A, 0xCF, 0xF7, 0x7A, 0xBE, 0x80, 0x90, 0xAE, 0xCA] },
    # 2-D lookup.
    { address = 0x59E4, value = [0xF9, 0x7A, 0x90, 0x81, 0x90, 0x7A, 0x67, 0x01, 0x01, 0xA3, 0x2D, 0xCD, 0x08, 0x79, 0xA2, 0x34, 0x92, 0x81, 0xF9, 0x92, 0xA8, 0x8A, 0x7B, 0xA2, 0x34, 0x90, 0x81, 0x90, 0xA8] },
]

# The whole ROM sums to zero. The last byte is unused.
[checksum]
kind = "sum8"
location = 0x7FFF

# Each fuel map is followed by one multiplier per column: the ECU uses cell x multiplier.
# RPM rows: the low-cam axis doubles every 64 steps from 500 rpm; the high-cam axis is linear.
# MAP columns: kPa for the factory sensor.

[[param]]
category = "Fuel"
name = "Fuel Map (Low Cam)"
address = 0x7050
kind = "table"
rows = 20
cols = 10
vtec = false
row_axis = { label = "RPM", address = 0x7014, encoding = "log-bytes", scale = 500 }
col_axis = { label = "MAP kPa", address = 0x7000, encoding = "bytes", scale = 0.36105, bias = 11.43 }
multiplier = { address = 0x7118 }

[[param]]
category = "Fuel"
name = "Fuel Map (High Cam)"
address = 0x7122
kind = "table"
rows = 20
cols = 10
vtec = true
row_axis = { label = "RPM", address = 0x7028, encoding = "bytes", scale = 35.2126 }
col_axis = { label = "MAP kPa", address = 0x7000, encoding = "bytes", scale = 0.36105, bias = 11.43 }
multiplier = { address = 0x71EA }

[[param]]
category = "Ignition"
name = "Ignition Map (Low Cam)"
address = 0x72E4
kind = "table"
rows = 20
cols = 10
unit = "° BTDC"
scale = 0.25
bias = -6.0
vtec = false
row_axis = { label = "RPM", address = 0x7014, encoding = "log-bytes", scale = 500 }
col_axis = { label = "MAP kPa", address = 0x7000, encoding = "bytes", scale = 0.36105, bias = 11.43 }

[[param]]
category = "Ignition"
name = "Ignition Map (High Cam)"
address = 0x73AC
kind = "table"
rows = 20
cols = 10
unit = "° BTDC"
scale = 0.25
bias = -6.0
vtec = true
row_axis = { label = "RPM", address = 0x7028, encoding = "bytes", scale = 35.2126 }
col_axis = { label = "MAP kPa", address = 0x7000, encoding = "bytes", scale = 0.36105, bias = 11.43 }
