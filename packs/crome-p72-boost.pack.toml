# ROMs of the P72 type whose maps CROME's Boost Tools+ enlarged: more MAP columns for boost,
# the maps and axes moved to free space, and the maps indexed by the raw MAP reading. The
# high-cam maps have 15 rows.
id = "crome-p72-boost"
name = "Honda OBD1, P72 type, CROME Boost Tools+"
platform = "obd1-66207"
rom_size = 0x8000

# The lookup code of the P72 type with the changes Boost Tools+ makes to it.
# The bytes a mask leaves out are the column count and the addresses of the maps and axes; the
# parameters below read them from the same places, so one pack serves every size and position.
[[fingerprint]]
bytes = [
    # Log-rpm code: 64 steps per octave from 500 rpm.
    { address = 0x07C7, value = [0x47, 0x98, 0xC0, 0xFF, 0x44, 0x98, 0x07, 0x00, 0x46, 0x98, 0x53, 0x07, 0x60, 0x00, 0x53] },
    # Linear rpm code: 53248 / period.
    { address = 0x0824, value = [0x44, 0x98, 0x00, 0xD0, 0xF9, 0x90, 0x37] },
    # MAP reading taken raw, with a cut-off the tune sets.
    { address = 0x0841, value = [0xF5, 0xBB, 0xC6, 0x00, 0xCD, 0x11, 0xC6, 0x00, 0xCF, 0x04, 0x77, 0x00, 0xCB, 0x09, 0xC5, 0xB0, 0x18, 0xF4, 0x35, 0xCB, 0x08, 0xFF, 0xFF], mask = [0xFF, 0xFF, 0xFF, 0x00, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF] },
    # Low-cam rpm breakpoints.
    { address = 0x0A4F, value = [0x60, 0x00, 0x00, 0xC3, 0x67, 0x4B, 0xC4, 0x36, 0x4A, 0x9E, 0x12], mask = [0xFF, 0x00, 0x00, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF] },
    # High-cam rpm breakpoints.
    { address = 0x0A67, value = [0x60, 0x00, 0x00, 0xC3, 0x68, 0x4B, 0xC5, 0xC2, 0x4A, 0x9E, 0x0D], mask = [0xFF, 0x00, 0x00, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF] },
    # Ignition columns: indexed by the raw MAP reading.
    { address = 0x0A9F, value = [0xF5, 0xBB] },
    # Ignition MAP breakpoints.
    { address = 0x0AA2, value = [0x60, 0x00, 0x00, 0xC3, 0x5E, 0x4B, 0x9E, 0x00], mask = [0xFF, 0x00, 0x00, 0xFF, 0xFF, 0xFF, 0xFF, 0x00] },
    # Fuel columns: indexed by the raw MAP reading.
    { address = 0x0AB4, value = [0xF5, 0xBB] },
    # Fuel MAP breakpoints.
    { address = 0x0AB7, value = [0x60, 0x00, 0x00, 0xC3, 0x5F, 0x4B, 0x9E, 0x00], mask = [0xFF, 0x00, 0x00, 0xFF, 0xFF, 0xFF, 0xFF, 0x00] },
    # Ignition: 20 rows, low-cam indexes.
    { address = 0x0B85, value = [0x98, 0x00, 0x99, 0x14, 0xC3, 0x5E, 0x4A, 0xB3, 0x60, 0x79, 0xC3, 0x67, 0x4B, 0xB3, 0x6A, 0x4B, 0x03, 0xDA, 0x64], mask = [0xFF, 0x00, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF] },
    # Ignition: 15 rows on the high cam.
    { address = 0x0BA1, value = [0x99, 0x0F, 0xC3, 0x68, 0x4B, 0xB3, 0x6C, 0x4B, 0x03, 0xE4, 0x64] },
    # Fuel: 15 rows, high-cam map.
    { address = 0x1266, value = [0x98, 0x00, 0x99, 0x0F, 0xC4, 0xDF, 0x4A, 0xB4, 0xE2, 0x79, 0xC4, 0xE8, 0x4B, 0xB4, 0xEC, 0x4B, 0x60, 0x00, 0x00], mask = [0xFF, 0x00, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0x00, 0x00] },
    # Fuel: 20 rows, low-cam map.
    { address = 0x1282, value = [0x99, 0x14, 0xC4, 0xE7, 0x4B, 0xB4, 0xEA, 0x4B, 0x60, 0x00, 0x00], mask = [0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0x00, 0x00] },
    # Fuel: lookup with column multipliers.
    { address = 0x128D, value = [0xA3, 0x1D, 0x32, 0xA6, 0x4E] },
    # Breakpoint search.
    { address = 0x4E74, value = [0xF9, 0x88, 0x8A, 0x7B, 0x4E, 0xCA, 0x01, 0x7E, 0x8E, 0x90, 0x81, 0xAE, 0x70, 0x90, 0xAA, 0xC9, 0x03, 0x4A, 0xCF, 0xF7, 0x7A, 0xBE, 0x80, 0x90, 0xAE, 0xCA] },
    # 2-D lookup.
    { address = 0x4EA6, value = [0xF9, 0x7A, 0x90, 0x81, 0x90, 0x7A, 0x67, 0x01, 0x01, 0xA3, 0x2D, 0xCD, 0x08, 0x79, 0xA2, 0x34, 0x92, 0x81, 0xF9, 0x92, 0xA8, 0x8A, 0x7B, 0xA2, 0x34, 0x90, 0x81, 0x90, 0xA8] },
    # Ignition: low-cam map.
    { address = 0x64DA, value = [0x46, 0x98, 0x00, 0x00, 0x60, 0x00, 0x00, 0x03, 0x98, 0x0B], mask = [0xFF, 0xFF, 0x00, 0x00, 0xFF, 0x00, 0x00, 0xFF, 0xFF, 0xFF] },
    # Ignition: high-cam map.
    { address = 0x64E4, value = [0x46, 0x98, 0x00, 0x00, 0x60, 0x00, 0x00, 0x03, 0xAC, 0x0B], mask = [0xFF, 0xFF, 0x00, 0x00, 0xFF, 0x00, 0x00, 0xFF, 0xFF, 0xFF] },
    # Ignition: lookup without column multipliers.
    { address = 0x64F9, value = [0xA3, 0x0D, 0x32, 0xA6, 0x4E] },
]

# The whole ROM sums to zero. The enlarged maps end one byte before the last, which is unused.
[checksum]
kind = "sum8"
location = 0x7FFF

# Each fuel map is followed by one multiplier per column: the ECU uses cell x multiplier. Fuel
# is shown as a quarter of that, the figure CROME and eCtune show.
# RPM rows: the low-cam axis doubles every 64 steps from 500 rpm; the high-cam axis is linear.
# MAP columns: the maps are indexed by the raw reading of the MAP sensor. The range of the
# sensor, in mbar, is written in the four bytes before the axis; columns are shown in kPa.

[[param]]
category = "Fuel"
name = "Fuel Map (Low Cam)"
address = { at = 0x128B }
kind = "table"
rows = 20
cols = { at = 0x1267 }
scale = 0.25
vtec = false
row_axis = { label = "RPM", address = { at = 0x0A50 }, encoding = "log-bytes", scale = 500 }
col_axis = { label = "MAP kPa", address = { at = 0x0AB8 }, encoding = "bytes", ends = { at = { at = 0x0AB8, bias = -4 }, bias = -32768 }, scale = 0.1 }
multiplier = { kind = "linear" }

[[param]]
category = "Fuel"
name = "Fuel Map (High Cam)"
address = { at = 0x1277 }
kind = "table"
rows = 15
cols = { at = 0x1267 }
scale = 0.25
vtec = true
row_axis = { label = "RPM", address = { at = 0x0A68 }, encoding = "bytes", scale = 35.2126 }
col_axis = { label = "MAP kPa", address = { at = 0x0AB8 }, encoding = "bytes", ends = { at = { at = 0x0AB8, bias = -4 }, bias = -32768 }, scale = 0.1 }
multiplier = { kind = "linear" }

[[param]]
category = "Ignition"
name = "Ignition Map (Low Cam)"
address = { at = 0x64DF }
kind = "table"
rows = 20
cols = { at = 0x0B86 }
unit = "° BTDC"
scale = 0.25
bias = -6.0
vtec = false
row_axis = { label = "RPM", address = { at = 0x0A50 }, encoding = "log-bytes", scale = 500 }
col_axis = { label = "MAP kPa", address = { at = 0x0AA3 }, encoding = "bytes", ends = { at = { at = 0x0AA3, bias = -4 }, bias = -32768 }, scale = 0.1 }

[[param]]
category = "Ignition"
name = "Ignition Map (High Cam)"
address = { at = 0x64E9 }
kind = "table"
rows = 15
cols = { at = 0x0B86 }
unit = "° BTDC"
scale = 0.25
bias = -6.0
vtec = true
row_axis = { label = "RPM", address = { at = 0x0A68 }, encoding = "bytes", scale = 35.2126 }
col_axis = { label = "MAP kPa", address = { at = 0x0AA3 }, encoding = "bytes", ends = { at = { at = 0x0AA3, bias = -4 }, bias = -32768 }, scale = 0.1 }
