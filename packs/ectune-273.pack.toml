kind = "table"
rows = 20
cols = 24
unit = "° BTDC"
scale = 0.25
bias = -6.0
vtec = false
row_axis = { label = "RPM", address = 0x6E71, encoding = "log-bytes", scale = 500 }
col_axis = { label = "MAP code", address = 0x6E59, encoding = "bytes" }

