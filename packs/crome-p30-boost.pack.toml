# ROMs of the P30 type whose maps CROME's Boost Tools+ enlarged: more MAP columns for boost,
# the maps and axes moved to free space, and the maps indexed by the raw MAP reading.
id = "crome-p30-boost"
name = "Honda OBD1, P30 type, CROME Boost Tools+"
platform = "obd1-66207"
rom_size = 0x8000

# The lookup code of the P30 type with the changes Boost Tools+ makes to it.
# The bytes a mask leaves out are the column count and the addresses of the maps and axes; the
# parameters below read them from the same places, so one pack serves every size and position.
[[fingerprint]]
bytes = [
    # Log-rpm code: 64 steps per octave from 500 rpm.
    { address = 0x07AA, value = [0x47, 0x98, 0xC0, 0xFF, 0x44, 0x98, 0x07, 0x00, 0x60, 0x00, 0x53, 0x62, 0x08, 0x6D] },
    # Linear rpm code: 53248 / period.
    { address = 0x0808, value = [0x44, 0x98, 0x00, 0xD0, 0xF9, 0x90, 0x37] },
    # MAP reading taken raw, with a cut-off the tune sets.
    { address = 0x0829, value = [0xF5, 0xA3, 0xC6, 0x00, 0xCD, 0x11, 0xC6, 0x00, 0xCF, 0x04, 0x77, 0x00, 0xCB, 0x09, 0xC5, 0x98, 0x18, 0xF4, 0x35, 0xCB, 0x08, 0xFF, 0xFF], mask = [0xFF, 0xFF, 0xFF, 0x00, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF] },
    # Low-cam rpm breakpoints.
    { address = 0x09DB, value = [0x60, 0x00, 0x00, 0xC3, 0x58, 0x4B, 0xC4, 0x36, 0x4A, 0x9E, 0x12], mask = [0xFF, 0x00, 0x00, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF] },
    # High-cam rpm breakpoints.
    { address = 0x09F3, value = [0x60, 0x00, 0x00, 0xC3, 0x59, 0x4B, 0xC5, 0xAA, 0x4A, 0x9E, 0x12], mask = [0xFF, 0x00, 0x00, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF] },
    # Ignition columns: indexed by the raw MAP reading.
    { address = 0x0A13, value = [0xF5, 0xA3] },
    # Ignition MAP breakpoints.
    { address = 0x0A16, value = [0x60, 0x00, 0x00, 0xC3, 0x52, 0x4B, 0x9E, 0x00], mask = [0xFF, 0x00, 0x00, 0xFF, 0xFF, 0xFF, 0xFF, 0x00] },
    # Fuel columns: indexed by the raw MAP reading.
    { address = 0x0A28, value = [0xF5, 0xA3] },
    # Fuel MAP breakpoints.
    { address = 0x0A2B, value = [0x60, 0x00, 0x00, 0xC3, 0x53, 0x4B, 0x9E, 0x00], mask = [0xFF, 0x00, 0x00, 0xFF, 0xFF, 0xFF, 0xFF, 0x00] },
    # Ignition: 20 rows, high-cam map.
    { address = 0x0B39, value = [0x98, 0x00, 0x99, 0x14, 0xC3, 0x52, 0x4A, 0xB3, 0x54, 0x79, 0xC3, 0x59, 0x4B, 0xB3, 0x5C, 0x4B, 0x60, 0x00, 0x00], mask = [0xFF, 0x00, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0x00, 0x00] },
    # Ignition: low-cam map.
    { address = 0x0B4F, value = [0xC3, 0x58, 0x4B, 0xB3, 0x5A, 0x4B, 0x60, 0x00, 0x00], mask = [0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0x00, 0x00] },
    # Ignition: lookup without column multipliers.
    { address = 0x0B76, value = [0xA3, 0x0D, 0x32, 0x10, 0x50] },
    # Fuel: 20 rows, high-cam map.
    { address = 0x1234, value = [0x98, 0x00, 0x99, 0x14, 0xC4, 0xD3, 0x4A, 0xB4, 0xD6, 0x79, 0xC4, 0xD9, 0x4B, 0xB4, 0xDC, 0x4B, 0x60, 0x00, 0x00], mask = [0xFF, 0x00, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0x00, 0x00] },
    # Fuel: low-cam map.
    { address = 0x1250, value = [0xC4, 0xD8, 0x4B, 0xB4, 0xDA, 0x4B, 0x60, 0x00, 0x00], mask = [0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0x00, 0x00] },
    # Fuel: lookup with column multipliers.
    { address = 0x126E, value = [0xA3, 0x1D, 0x32, 0x10, 0x50] },
    # Breakpoint search.
    { address = 0x4FDE, value = [0xF9, 0x88, 0x8A, 0x7B, 0x4E, 0xCA, 0x01, 0x7E, 0x8E, 0x90, 0x81, 0xAE, 0x70, 0x90, 0xAA, 0xC9, 0x03, 0x4A, 0xCF, 0xF7, 0x7A, 0xBE, 0x80, 0x90, 0xAE, 0xCA] },
    # 2-D lookup.
    { address = 0x5010, value = [0xF9, 0x7A, 0x90, 0x81, 0x90, 0x7A, 0x67, 0x01, 0x01, 0xA3, 0x2D, 0xCD, 0x08, 0x79, 0xA2, 0x34, 0x92, 0x81, 0xF9, 0x92, 0xA8, 0x8A, 0x7B, 0xA2, 0x34, 0x90, 0x81, 0x90, 0xA8] },
    # Rpm octave limits.
    { address = 0x6D08, value = [0x53, 0x07, 0xA9, 0x03, 0xD4, 0x01, 0xEA, 0x00] },
]

# The whole ROM sums to zero. The last byte is unused.
[checksum]
kind = "sum8"
location = 0x7FFF

# Each fuel map is followed by one multiplier per column: the ECU uses cell x multiplier. Fuel
# is shown as a quarter of that, the figure CROME and eCtune show.
# RPM rows: the low-cam axis doubles every 64 steps from 500 rpm; the high-cam axis is linear.
# MAP columns: the maps are indexed by the raw reading of the MAP sensor. The range of the
# sensor, in mbar, is written in the four bytes before the axis; columns are shown in kPa.

[[param]]
category = "Fuel"
name = "Fuel Map (Low Cam)"
doc = "How much fuel the engine gets at each engine speed (rows) and engine load (columns) while VTEC is off. A bigger number means more fuel."
address = { at = 0x1257 }
kind = "table"
rows = 20
cols = { at = 0x1235 }
scale = 0.25
vtec = false
row_axis = { label = "RPM", address = { at = 0x09DC }, encoding = "log-bytes", scale = 500 }
col_axis = { label = "MAP kPa", address = { at = 0x0A2C }, encoding = "bytes", ends = { at = { at = 0x0A2C, bias = -4 }, bias = -32768 }, scale = 0.1 }
multiplier = { kind = "linear" }

[[param]]
category = "Fuel"
name = "Fuel Map (High Cam)"
doc = "How much fuel the engine gets at each engine speed (rows) and engine load (columns) while VTEC is on. A bigger number means more fuel."
address = { at = 0x1245 }
kind = "table"
rows = 20
cols = { at = 0x1235 }
scale = 0.25
vtec = true
row_axis = { label = "RPM", address = { at = 0x09F4 }, encoding = "bytes", scale = 35.2126 }
col_axis = { label = "MAP kPa", address = { at = 0x0A2C }, encoding = "bytes", ends = { at = { at = 0x0A2C, bias = -4 }, bias = -32768 }, scale = 0.1 }
multiplier = { kind = "linear" }

[[param]]
category = "Ignition"
name = "Ignition Map (Low Cam)"
doc = "When the spark fires at each engine speed (rows) and engine load (columns) while VTEC is off, in degrees before the piston reaches the top. A bigger number means an earlier spark."
address = { at = 0x0B56 }
kind = "table"
rows = 20
cols = { at = 0x0B3A }
unit = "° BTDC"
scale = 0.25
bias = -6.0
vtec = false
row_axis = { label = "RPM", address = { at = 0x09DC }, encoding = "log-bytes", scale = 500 }
col_axis = { label = "MAP kPa", address = { at = 0x0A17 }, encoding = "bytes", ends = { at = { at = 0x0A17, bias = -4 }, bias = -32768 }, scale = 0.1 }

[[param]]
category = "Ignition"
name = "Ignition Map (High Cam)"
doc = "When the spark fires at each engine speed (rows) and engine load (columns) while VTEC is on, in degrees before the piston reaches the top. A bigger number means an earlier spark."
address = { at = 0x0B4A }
kind = "table"
rows = 20
cols = { at = 0x0B3A }
unit = "° BTDC"
scale = 0.25
bias = -6.0
vtec = true
row_axis = { label = "RPM", address = { at = 0x09F4 }, encoding = "bytes", scale = 35.2126 }
col_axis = { label = "MAP kPa", address = { at = 0x0A17 }, encoding = "bytes", ends = { at = { at = 0x0A17, bias = -4 }, bias = -32768 }, scale = 0.1 }
