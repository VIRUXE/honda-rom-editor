# The CROME Gold base ROM (v0.94) and tunes made on it that keep its map layout.
id = "crome-gold"
name = "CROME Gold base"
platform = "obd1-66207"
rom_size = 0x8000

# The bytes with which this firmware finds its main maps and axes. A ROM whose maps were moved
# or resized does not match.
[[fingerprint]]
bytes = [
    { address = 0x07AA, value = [0x47, 0x98, 0xC0, 0xFF, 0x44, 0x98, 0x07, 0x00, 0x60, 0x00, 0x53, 0x62, 0x08, 0x6D] },
    { address = 0x7946, value = [0xB5, 0xAC, 0x4A, 0x44, 0x98, 0x00, 0xAA, 0x90, 0x37] },
    { address = 0x09DB, value = [0x60, 0x72, 0x6E, 0xC3, 0x58, 0x4B, 0xC4, 0x36, 0x4A, 0x9E, 0x12] },
    { address = 0x09F3, value = [0x60, 0x86, 0x6E, 0xC3, 0x59, 0x4B, 0xC4, 0xFE, 0x4A, 0x9E, 0x12] },
    { address = 0x0A16, value = [0x60, 0x5A, 0x6E, 0xC3, 0x52, 0x4B, 0x9E, 0x08] },
    { address = 0x0A2B, value = [0x60, 0x5A, 0x6E, 0xC3, 0x53, 0x4B, 0x9E, 0x08] },
    { address = 0x0B39, value = [0x98, 0x18, 0x99, 0x14, 0xC3, 0x52, 0x4A, 0xB3, 0x54, 0x79, 0xC3, 0x59, 0x4B, 0xB3, 0x5C, 0x4B, 0x60, 0x6A, 0x74] },
    { address = 0x0B4F, value = [0xC3, 0x58, 0x4B, 0xB3, 0x5A, 0x4B, 0x60, 0x8A, 0x72] },
    { address = 0x0B76, value = [0xA3, 0x0D, 0x32, 0x10, 0x50] },
    { address = 0x11F9, value = [0x98, 0x18, 0x99, 0x14, 0xC4, 0xD3, 0x4A, 0xB4, 0xD6, 0x79, 0xC4, 0xD9, 0x4B, 0xB4, 0xDC, 0x4B, 0x60, 0x92, 0x70] },
    { address = 0x1215, value = [0xC4, 0xD8, 0x4B, 0xB4, 0xDA, 0x4B, 0x60, 0x9A, 0x6E] },
    { address = 0x126E, value = [0xA3, 0x1D, 0x32, 0x10, 0x50] },
    { address = 0x4FDE, value = [0xF9, 0x88, 0x8A, 0x7B, 0x4E, 0xCA, 0x01, 0x7E, 0x8E, 0x90, 0x81, 0xAE, 0x70, 0x90, 0xAA, 0xC9, 0x03, 0x4A, 0xCF, 0xF7, 0x7A, 0xBE, 0x80, 0x90, 0xAE, 0xCA] },
    { address = 0x5010, value = [0xF9, 0x7A, 0x90, 0x81, 0x90, 0x7A, 0x67, 0x01, 0x01, 0xA3, 0x2D, 0xCD, 0x08, 0x79, 0xA2, 0x34, 0x92, 0x81, 0xF9, 0x92, 0xA8, 0x8A, 0x7B, 0xA2, 0x34, 0x90, 0x81, 0x90, 0xA8] },
    { address = 0x6D08, value = [0x53, 0x07, 0xA9, 0x03, 0xD4, 0x01, 0xEA, 0x00] },
]

# The whole ROM sums to zero. Tables run to the last byte, so the sum is corrected in the
# fourth byte after the vector table.
[checksum]
kind = "sum8"
location = 0x003B

# Each map holds 24 columns; the columns a tune does not use repeat the last breakpoint.
# Each fuel map is followed by one multiplier per column: the ECU uses cell x multiplier. Fuel
# is shown as a quarter of that, the figure CROME and eCtune show.
# RPM rows: the low-cam axis doubles every 64 steps from 500 rpm; the high-cam axis is linear.
# MAP columns are shown as the stored code: the pressure a code stands for depends on the MAP
# sensor set in the ROM.

[[param]]
category = "Fuel"
name = "Fuel Map (Low Cam)"
address = 0x6E9A
kind = "table"
rows = 20
cols = 24
scale = 0.25
vtec = false
row_axis = { label = "RPM", address = 0x6E72, encoding = "log-bytes", scale = 500 }
col_axis = { label = "MAP code", address = 0x6E5A, encoding = "bytes" }
multiplier = { kind = "linear" }

[[param]]
category = "Fuel"
name = "Fuel Map (High Cam)"
address = 0x7092
kind = "table"
rows = 20
cols = 24
scale = 0.25
vtec = true
row_axis = { label = "RPM", address = 0x6E86, encoding = "bytes", scale = 43.0836 }
col_axis = { label = "MAP code", address = 0x6E5A, encoding = "bytes" }
multiplier = { kind = "linear" }

[[param]]
category = "Ignition"
name = "Ignition Map (Low Cam)"
address = 0x728A
kind = "table"
rows = 20
cols = 24
unit = "° BTDC"
scale = 0.25
bias = -6.0
vtec = false
row_axis = { label = "RPM", address = 0x6E72, encoding = "log-bytes", scale = 500 }
col_axis = { label = "MAP code", address = 0x6E5A, encoding = "bytes" }

[[param]]
category = "Ignition"
name = "Ignition Map (High Cam)"
address = 0x746A
kind = "table"
rows = 20
cols = 24
unit = "° BTDC"
scale = 0.25
bias = -6.0
vtec = true
row_axis = { label = "RPM", address = 0x6E86, encoding = "bytes", scale = 43.0836 }
col_axis = { label = "MAP code", address = 0x6E5A, encoding = "bytes" }
