# The boost base ROMs that Uberdata ships: P72 type with 15 MAP columns at fixed addresses and
# a MAP code that reaches twice as far as the factory one. The high-cam maps have 15 rows.
id = "uberdata-p72"
name = "Honda OBD1, P72 type, Uberdata 15 columns"
platform = "obd1-66207"
rom_size = 0x8000

# The lookup code of the P72 type with the changes these ROMs make to it.
[[fingerprint]]
bytes = [
    # Log-rpm code: 64 steps per octave from 500 rpm.
    { address = 0x07C7, value = [0x47, 0x98, 0xC0, 0xFF, 0x44, 0x98, 0x07, 0x00, 0x46, 0x98, 0x53, 0x07, 0x60, 0x00, 0x53] },
    # Linear rpm code: 53248 / period.
    { address = 0x0824, value = [0x44, 0x98, 0x00, 0xD0, 0xF9, 0x90, 0x37] },
    # MAP code, without the factory upper limit.
    { address = 0x0841, value = [0xE5, 0xBA, 0x83, 0xF5, 0x06, 0xC6, 0xA1, 0x00, 0x00, 0xC6, 0x0B, 0xCD, 0x07, 0xC5, 0xB0, 0x18, 0xF4, 0x35, 0xCB, 0x09, 0x32, 0xCB, 0x4D] },
    # Low-cam rpm breakpoints.
    { address = 0x0A4F, value = [0x60, 0x68, 0x7C, 0xC3, 0x67, 0x4B, 0xC4, 0x36, 0x4A, 0x9E, 0x12] },
    # High-cam rpm breakpoints.
    { address = 0x0A67, value = [0x60, 0x7C, 0x7C, 0xC3, 0x68, 0x4B, 0xC5, 0xC2, 0x4A, 0x9E, 0x0D] },
    # Ignition columns: indexed by the MAP code.
    { address = 0x0A9F, value = [0xF5, 0xBF] },
    # Ignition MAP breakpoints.
    { address = 0x0AA2, value = [0x60, 0x4A, 0x7C, 0xC3, 0x5E, 0x4B, 0x9E, 0x0D] },
    # Fuel columns: indexed by the MAP code.
    { address = 0x0AB4, value = [0xF5, 0xBF] },
    # Fuel MAP breakpoints.
    { address = 0x0AB7, value = [0x60, 0x4A, 0x7C, 0xC3, 0x5F, 0x4B, 0x9E, 0x0D] },
    # Ignition: 20 rows, low-cam indexes.
    { address = 0x0B85, value = [0x98, 0x0F, 0x99, 0x14, 0xC3, 0x5E, 0x4A, 0xB3, 0x60, 0x79, 0xC3, 0x67, 0x4B, 0xB3, 0x6A, 0x4B, 0x03, 0xDA, 0x64] },
    # Ignition: 15 rows on the high cam.
    { address = 0x0BA1, value = [0x99, 0x0F, 0xC3, 0x68, 0x4B, 0xB3, 0x6C, 0x4B, 0x03, 0xE4, 0x64] },
    # Fuel: 15 rows, high-cam map.
    { address = 0x1266, value = [0x98, 0x0F, 0x99, 0x0F, 0xC4, 0xDF, 0x4A, 0xB4, 0xE2, 0x79, 0xC4, 0xE8, 0x4B, 0xB4, 0xEC, 0x4B, 0x60, 0xF0, 0x71] },
    # Fuel: 20 rows, low-cam map.
    { address = 0x1282, value = [0x99, 0x14, 0xC4, 0xE7, 0x4B, 0xB4, 0xEA, 0x4B, 0x60, 0x70, 0x67] },
    # Fuel: lookup with column multipliers.
    { address = 0x128D, value = [0xA3, 0x1D, 0x32, 0xA6, 0x4E] },
    # The ROM sum is not checked.
    { address = 0x2A1D, value = [0x03, 0x2A, 0x2A] },
    # MAP code = sample - 24: half the factory resolution, twice the range.
    { address = 0x4DCB, value = [0xA6, 0x18, 0xCA, 0x09, 0xC5, 0x07, 0x2F, 0x01, 0xCD, 0x02, 0x77, 0xFF, 0x01, 0xFA, 0x01] },
    # Breakpoint search.
    { address = 0x4E74, value = [0xF9, 0x88, 0x8A, 0x7B, 0x4E, 0xCA, 0x01, 0x7E, 0x8E, 0x90, 0x81, 0xAE, 0x70, 0x90, 0xAA, 0xC9, 0x03, 0x4A, 0xCF, 0xF7, 0x7A, 0xBE, 0x80, 0x90, 0xAE, 0xCA] },
    # 2-D lookup.
    { address = 0x4EA6, value = [0xF9, 0x7A, 0x90, 0x81, 0x90, 0x7A, 0x67, 0x01, 0x01, 0xA3, 0x2D, 0xCD, 0x08, 0x79, 0xA2, 0x34, 0x92, 0x81, 0xF9, 0x92, 0xA8, 0x8A, 0x7B, 0xA2, 0x34, 0x90, 0x81, 0x90, 0xA8] },
    # Ignition: low-cam map.
    { address = 0x64DA, value = [0x46, 0x98, 0xEC, 0x7A, 0x60, 0x90, 0x6B, 0x03, 0x98, 0x0B] },
    # Ignition: high-cam map.
    { address = 0x64E4, value = [0x46, 0x98, 0xB4, 0x7B, 0x60, 0x60, 0x70, 0x03, 0xAC, 0x0B] },
    # Ignition: lookup without column multipliers.
    { address = 0x64F9, value = [0xA3, 0x0D, 0x32, 0xA6, 0x4E] },
]

# These ROMs skip the factory check of the ROM sum.
[checksum]
kind = "none"

# Each fuel map is followed by one multiplier per column: the ECU uses cell x multiplier. Fuel
# is shown as a quarter of that, the figure CROME and eCtune show.
# RPM rows: the low-cam axis doubles every 64 steps from 500 rpm; the high-cam axis is linear.
# MAP columns: kPa for the factory sensor, on the wider MAP code of these ROMs.

[[param]]
category = "Fuel"
name = "Fuel Map (Low Cam)"
address = 0x6770
kind = "table"
rows = 20
cols = 15
scale = 0.25
vtec = false
row_axis = { label = "RPM", address = 0x7C68, encoding = "log-bytes", scale = 500 }
col_axis = { label = "MAP kPa", address = 0x7C4A, encoding = "bytes", scale = 0.7221, bias = 11.43 }
multiplier = { kind = "linear" }

[[param]]
category = "Fuel"
name = "Fuel Map (High Cam)"
address = 0x71F0
kind = "table"
rows = 15
cols = 15
scale = 0.25
vtec = true
row_axis = { label = "RPM", address = 0x7C7C, encoding = "bytes", scale = 35.2126 }
col_axis = { label = "MAP kPa", address = 0x7C4A, encoding = "bytes", scale = 0.7221, bias = 11.43 }
multiplier = { kind = "linear" }

[[param]]
category = "Ignition"
name = "Ignition Map (Low Cam)"
address = 0x6B90
kind = "table"
rows = 20
cols = 15
unit = "° BTDC"
scale = 0.25
bias = -6.0
vtec = false
row_axis = { label = "RPM", address = 0x7C68, encoding = "log-bytes", scale = 500 }
col_axis = { label = "MAP kPa", address = 0x7C4A, encoding = "bytes", scale = 0.7221, bias = 11.43 }

[[param]]
category = "Ignition"
name = "Ignition Map (High Cam)"
address = 0x7060
kind = "table"
rows = 15
cols = 15
unit = "° BTDC"
scale = 0.25
bias = -6.0
vtec = true
row_axis = { label = "RPM", address = 0x7C7C, encoding = "bytes", scale = 35.2126 }
col_axis = { label = "MAP kPa", address = 0x7C4A, encoding = "bytes", scale = 0.7221, bias = 11.43 }
