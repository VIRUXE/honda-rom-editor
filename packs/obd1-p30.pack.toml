# Factory firmware of the kind the P30 carries, and tunes made on it that keep its map layout.
# Checked on ROM numbers 202, 203, 205, 209, 215, 219, 224, 230 (P28), 231, 232, 233, 235, 237
# and 240.
id = "obd1-p30"
name = "Honda OBD1, P30 type"
doc = "The type names the program inside the ROM, not the part number on the ECU: one part number can carry either type."
platform = "obd1-66207"
rom_size = 0x8000

# The fingerprint is the code that finds the four main maps and their axes, and that turns
# engine speed and manifold pressure into the codes the axes are written in. A ROM that holds
# these bytes reads its maps from the addresses below, in the units given below; one whose maps
# were moved or resized, or whose MAP sensor scaling was changed, does not match.
[[fingerprint]]
bytes = [
    # Log-rpm code: 64 steps per octave from 500 rpm.
    { address = 0x07AA, value = [0x47, 0x98, 0xC0, 0xFF, 0x44, 0x98, 0x07, 0x00, 0x60, 0x00, 0x53, 0x62, 0x08, 0x6D] },
    # Linear rpm code: 53248 / period.
    { address = 0x0808, value = [0x44, 0x98, 0x00, 0xD0, 0xF9, 0x90, 0x37] },
    # MAP code.
    { address = 0x083D, value = [0x32, 0x21, 0x4F] },
    # Low-cam rpm breakpoints.
    { address = 0x09DB, value = [0x60, 0x0A, 0x70, 0xC3, 0x58, 0x4B, 0xC4, 0x36, 0x4A, 0x9E, 0x12] },
    # High-cam rpm breakpoints.
    { address = 0x09F3, value = [0x60, 0x1E, 0x70, 0xC3, 0x59, 0x4B, 0xC5, 0xAA, 0x4A, 0x9E, 0x12] },
    # Ignition MAP breakpoints.
    { address = 0x0A16, value = [0x60, 0x00, 0x70, 0xC3, 0x52, 0x4B, 0x9E, 0x08] },
    # Fuel MAP breakpoints.
    { address = 0x0A2B, value = [0x60, 0x00, 0x70, 0xC3, 0x53, 0x4B, 0x9E, 0x08] },
    # Ignition: 10 columns, 20 rows, high-cam map.
    { address = 0x0B39, value = [0x98, 0x0A, 0x99, 0x14, 0xC3, 0x52, 0x4A, 0xB3, 0x54, 0x79, 0xC3, 0x59, 0x4B, 0xB3, 0x5C, 0x4B, 0x60, 0x16, 0x73] },
    # Ignition: low-cam map.
    { address = 0x0B4F, value = [0xC3, 0x58, 0x4B, 0xB3, 0x5A, 0x4B, 0x60, 0x4E, 0x72] },
    # Ignition: lookup without column multipliers.
    { address = 0x0B76, value = [0xA3, 0x0D, 0x32, 0x10, 0x50] },
    # Fuel: 10 columns, 20 rows, high-cam map.
    { address = 0x1234, value = [0x98, 0x0A, 0x99, 0x14, 0xC4, 0xD3, 0x4A, 0xB4, 0xD6, 0x79, 0xC4, 0xD9, 0x4B, 0xB4, 0xDC, 0x4B, 0x60, 0x04, 0x71] },
    # Fuel: low-cam map.
    { address = 0x1250, value = [0xC4, 0xD8, 0x4B, 0xB4, 0xDA, 0x4B, 0x60, 0x32, 0x70] },
    # Fuel: lookup with column multipliers.
    { address = 0x126E, value = [0xA3, 0x1D, 0x32, 0x10, 0x50] },
    # MAP code = 2 x (sample - 24).
    { address = 0x4F21, value = [0xA6, 0x18, 0xCD, 0x02, 0xFA, 0x01, 0xC5, 0x07, 0x2F, 0x33, 0xCD, 0x02, 0x77, 0xFF, 0x01] },
    # Breakpoint search.
    { address = 0x4FDE, value = [0xF9, 0x88, 0x8A, 0x7B, 0x4E, 0xCA, 0x01, 0x7E, 0x8E, 0x90, 0x81, 0xAE, 0x70, 0x90, 0xAA, 0xC9, 0x03, 0x4A, 0xCF, 0xF7, 0x7A, 0xBE, 0x80, 0x90, 0xAE, 0xCA] },
    # 2-D lookup.
    { address = 0x5010, value = [0xF9, 0x7A, 0x90, 0x81, 0x90, 0x7A, 0x67, 0x01, 0x01, 0xA3, 0x2D, 0xCD, 0x08, 0x79, 0xA2, 0x34, 0x92, 0x81, 0xF9, 0x92, 0xA8, 0x8A, 0x7B, 0xA2, 0x34, 0x90, 0x81, 0x90, 0xA8] },
    # Rpm octave limits.
    { address = 0x6D08, value = [0x53, 0x07, 0xA9, 0x03, 0xD4, 0x01, 0xEA, 0x00] },
]

# The whole ROM sums to zero. The last byte is unused.
[checksum]
kind = "sum8"
location = 0x7FFF

# Each fuel map is followed by one multiplier per column: the ECU uses cell x multiplier. Fuel
# is shown as a quarter of that, the figure CROME and eCtune show.
# RPM rows: the low-cam axis doubles every 64 steps from 500 rpm; the high-cam axis is linear.
# MAP columns: kPa for the factory sensor.

[[param]]
category = "Fuel"
name = "Fuel Map (Low Cam)"
doc = "How much fuel the engine gets at each engine speed (rows) and engine load (columns) while VTEC is off. A bigger number means more fuel."
address = 0x7032
kind = "table"
rows = 20
cols = 10
scale = 0.25
vtec = false
row_axis = { label = "RPM", address = 0x700A, encoding = "log-bytes", scale = 500 }
col_axis = { label = "MAP kPa", address = 0x7000, encoding = "bytes", scale = 0.36105, bias = 11.43 }
multiplier = { kind = "linear" }

[[param]]
category = "Fuel"
name = "Fuel Map (High Cam)"
doc = "How much fuel the engine gets at each engine speed (rows) and engine load (columns) while VTEC is on. A bigger number means more fuel."
address = 0x7104
kind = "table"
rows = 20
cols = 10
scale = 0.25
vtec = true
row_axis = { label = "RPM", address = 0x701E, encoding = "bytes", scale = 35.2126 }
col_axis = { label = "MAP kPa", address = 0x7000, encoding = "bytes", scale = 0.36105, bias = 11.43 }
multiplier = { kind = "linear" }

[[param]]
category = "Ignition"
name = "Ignition Map (Low Cam)"
doc = "When the spark fires at each engine speed (rows) and engine load (columns) while VTEC is off, in degrees before the piston reaches the top. A bigger number means an earlier spark."
address = 0x724E
kind = "table"
rows = 20
cols = 10
unit = "° BTDC"
scale = 0.25
bias = -6.0
vtec = false
row_axis = { label = "RPM", address = 0x700A, encoding = "log-bytes", scale = 500 }
col_axis = { label = "MAP kPa", address = 0x7000, encoding = "bytes", scale = 0.36105, bias = 11.43 }

[[param]]
category = "Ignition"
name = "Ignition Map (High Cam)"
doc = "When the spark fires at each engine speed (rows) and engine load (columns) while VTEC is on, in degrees before the piston reaches the top. A bigger number means an earlier spark."
address = 0x7316
kind = "table"
rows = 20
cols = 10
unit = "° BTDC"
scale = 0.25
bias = -6.0
vtec = true
row_axis = { label = "RPM", address = 0x701E, encoding = "bytes", scale = 35.2126 }
col_axis = { label = "MAP kPa", address = 0x7000, encoding = "bytes", scale = 0.36105, bias = 11.43 }
