# Factory firmware of the kind the P72 carries, and tunes made on it that keep its map layout.
# Checked on ROM numbers 269, 270, 273, 274 and 332. The high-cam maps have 15 rows; ROMs for
# engines without VTEC leave them and their axis empty.
id = "obd1-p72"
name = "Honda OBD1, P72 type"
platform = "obd1-66207"
rom_size = 0x8000

# The fingerprint is the code that finds the four main maps and their axes, and that turns
# engine speed and manifold pressure into the codes the axes are written in. A ROM that holds
# these bytes reads its maps from the addresses below, in the units given below; one whose maps
# were moved or resized, or whose MAP sensor scaling was changed, does not match.
[[fingerprint]]
bytes = [
    # Log-rpm code: 64 steps per octave from 500 rpm.
    { address = 0x07C7, value = [0x47, 0x98, 0xC0, 0xFF, 0x44, 0x98, 0x07, 0x00, 0x46, 0x98, 0x53, 0x07, 0x60, 0x00, 0x53] },
    # Linear rpm code: 53248 / period.
    { address = 0x0824, value = [0x44, 0x98, 0x00, 0xD0, 0xF9, 0x90, 0x37] },
    # MAP code.
    { address = 0x0855, value = [0x32, 0xCB, 0x4D] },
    # Low-cam rpm breakpoints.
    { address = 0x0A4F, value = [0x60, 0x68, 0x7C, 0xC3, 0x67, 0x4B, 0xC4, 0x36, 0x4A, 0x9E, 0x12] },
    # High-cam rpm breakpoints.
    { address = 0x0A67, value = [0x60, 0x7C, 0x7C, 0xC3, 0x68, 0x4B, 0xC5, 0xC2, 0x4A, 0x9E, 0x0D] },
    # Ignition MAP breakpoints.
    { address = 0x0AA2, value = [0x60, 0x54, 0x7C, 0xC3, 0x5E, 0x4B, 0x9E, 0x08] },
    # Fuel MAP breakpoints.
    { address = 0x0AB7, value = [0x60, 0x4A, 0x7C, 0xC3, 0x5F, 0x4B, 0x9E, 0x08] },
    # Ignition: 10 columns, 20 rows, low-cam indexes.
    { address = 0x0B85, value = [0x98, 0x0A, 0x99, 0x14, 0xC3, 0x5E, 0x4A, 0xB3, 0x60, 0x79, 0xC3, 0x67, 0x4B, 0xB3, 0x6A, 0x4B, 0x03, 0xDA, 0x64] },
    # Ignition: 15 rows on the high cam.
    { address = 0x0BA1, value = [0x99, 0x0F, 0xC3, 0x68, 0x4B, 0xB3, 0x6C, 0x4B, 0x03, 0xE4, 0x64] },
    # Ignition: low-cam map.
    { address = 0x64DA, value = [0x46, 0x98, 0xEC, 0x7A, 0x60, 0x0C, 0x7E, 0x03, 0x98, 0x0B] },
    # Ignition: high-cam map.
    { address = 0x64E4, value = [0x46, 0x98, 0xB4, 0x7B, 0x60, 0xD4, 0x7E, 0x03, 0xAC, 0x0B] },
    # Ignition: lookup without column multipliers.
    { address = 0x64F9, value = [0xA3, 0x0D, 0x32, 0xA6, 0x4E] },
    # Fuel: 10 columns, 15 rows, high-cam map.
    { address = 0x1266, value = [0x98, 0x0A, 0x99, 0x0F, 0xC4, 0xDF, 0x4A, 0xB4, 0xE2, 0x79, 0xC4, 0xE8, 0x4B, 0xB4, 0xEC, 0x4B, 0x60, 0x6C, 0x7D] },
    # Fuel: 20 rows, low-cam map.
    { address = 0x1282, value = [0x99, 0x14, 0xC4, 0xE7, 0x4B, 0xB4, 0xEA, 0x4B, 0x60, 0x9A, 0x7C] },
    # Fuel: lookup with column multipliers.
    { address = 0x128D, value = [0xA3, 0x1D, 0x32, 0xA6, 0x4E] },
    # MAP code = 2 x (sample - 24).
    { address = 0x4DCB, value = [0xA6, 0x18, 0xCA, 0x09, 0xC5, 0x07, 0x2F, 0x33, 0xCD, 0x02, 0x77, 0xFF, 0x01, 0xFA, 0x01] },
    # Breakpoint search.
    { address = 0x4E74, value = [0xF9, 0x88, 0x8A, 0x7B, 0x4E, 0xCA, 0x01, 0x7E, 0x8E, 0x90, 0x81, 0xAE, 0x70, 0x90, 0xAA, 0xC9, 0x03, 0x4A, 0xCF, 0xF7, 0x7A, 0xBE, 0x80, 0x90, 0xAE, 0xCA] },
    # 2-D lookup.
    { address = 0x4EA6, value = [0xF9, 0x7A, 0x90, 0x81, 0x90, 0x7A, 0x67, 0x01, 0x01, 0xA3, 0x2D, 0xCD, 0x08, 0x79, 0xA2, 0x34, 0x92, 0x81, 0xF9, 0x92, 0xA8, 0x8A, 0x7B, 0xA2, 0x34, 0x90, 0x81, 0x90, 0xA8] },
]

# The whole ROM sums to zero. Tables run to the last byte, so the sum is corrected in the
# fourth byte after the vector table, which the ECU only copies to RAM as part of an identifier.
[checksum]
kind = "sum8"
location = 0x003B

# Each fuel map is followed by one multiplier per column: the ECU uses cell x multiplier. Fuel
# is shown as a quarter of that, the figure CROME and eCtune show.
# RPM rows: the low-cam axis doubles every 64 steps from 500 rpm; the high-cam axis is linear.
# MAP columns: kPa for the factory sensor. Fuel and ignition have a MAP axis each.

[[param]]
category = "Fuel"
name = "Fuel Map (Low Cam)"
address = 0x7C9A
kind = "table"
rows = 20
cols = 10
scale = 0.25
vtec = false
row_axis = { label = "RPM", address = 0x7C68, encoding = "log-bytes", scale = 500 }
col_axis = { label = "MAP kPa", address = 0x7C4A, encoding = "bytes", scale = 0.36105, bias = 11.43 }
multiplier = { address = 0x7D62 }

[[param]]
category = "Fuel"
name = "Fuel Map (High Cam)"
address = 0x7D6C
kind = "table"
rows = 15
cols = 10
scale = 0.25
vtec = true
row_axis = { label = "RPM", address = 0x7C7C, encoding = "bytes", scale = 35.2126 }
col_axis = { label = "MAP kPa", address = 0x7C4A, encoding = "bytes", scale = 0.36105, bias = 11.43 }
multiplier = { address = 0x7E02 }

[[param]]
category = "Ignition"
name = "Ignition Map (Low Cam)"
address = 0x7E0C
kind = "table"
rows = 20
cols = 10
unit = "° BTDC"
scale = 0.25
bias = -6.0
vtec = false
row_axis = { label = "RPM", address = 0x7C68, encoding = "log-bytes", scale = 500 }
col_axis = { label = "MAP kPa", address = 0x7C54, encoding = "bytes", scale = 0.36105, bias = 11.43 }

[[param]]
category = "Ignition"
name = "Ignition Map (High Cam)"
address = 0x7ED4
kind = "table"
rows = 15
cols = 10
unit = "° BTDC"
scale = 0.25
bias = -6.0
vtec = true
row_axis = { label = "RPM", address = 0x7C7C, encoding = "bytes", scale = 35.2126 }
col_axis = { label = "MAP kPa", address = 0x7C54, encoding = "bytes", scale = 0.36105, bias = 11.43 }
